quarkus.application.name=marca-ai-auth
quarkus.http.port=8081

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:admin}
quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_marca_ai}

# As tabelas do auth vivem no schema marca_ai_auth, nao no public. Com o
# search_path apontado aqui, o SQL dos repositories segue sem qualificar nada.
quarkus.datasource.reactive.additional-properties."search_path"=${DB_SCHEMA:marca_ai_auth}

# Pool de conexoes
quarkus.datasource.reactive.max-size=20
quarkus.datasource.reactive.idle-timeout=PT10M

# ---------------------------------------------------------------------------
# Redis: contador de tentativas de login falhas (FailedAttemptsRepository).
# O /1 no final da URI seleciona o database 1. Sem esta propriedade o Quarkus
# sobe um Redis proprio via Dev Services em vez de usar o do docker-compose.
# ---------------------------------------------------------------------------
quarkus.redis.hosts=redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}/1

# ---------------------------------------------------------------------------
# Client externo: consulta de CNPJ (BrasilAPI)
# ---------------------------------------------------------------------------
quarkus.rest-client.check-cnpj.url=https://brasilapi.com.br
quarkus.rest-client.check-cnpj.connect-timeout=2000
quarkus.rest-client.check-cnpj.read-timeout=5000

auth.master-key=4bBS9YdeBvweSDowNTO/1TVENS57kuVOIhr2p72liSo=

mp.jwt.verify.issuer=https://marca-ai.com.br/auth
smallrye.jwt.new-token.issuer=https://marca-ai.com.br/auth

auth.token.duration=180

quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} - ${quarkus.application.name} : [%-1p] %s%e%n
quarkus.log.level=INFO
quarkus.console.color=false


quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.trusted-proxies=172.16.0.0/12
